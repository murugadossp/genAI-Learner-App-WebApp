# Tools and models used by the write-web-lesson skill for independent reviews and image generation.
# The skill reads this file. Change a model or command here, not in SKILL.md.
# Try providers in `order`; use the first one that is available (not out of usage, setup passes).
# Say in the report's review log which provider and model ran each round.
# Last tested: 2026-11-09 (agy and claude CLI review calls returned output). 2026-11-10: the agy image command below produced a 1376x768 JPEG from a scratch folder.

review:
  # Same job at all gates: plan review, content review rounds, and the final review.
  # Always read-only. Run in the background and write output to a file.
  order: [codex, agy-gemini, claude-haiku, separate-agent]
  providers:
    codex:
      preferred: true
      note: Default reviewer. Use the Codex plugin (see codex:setup if the check fails).
    agy-gemini:
      model: gemini-4-argon-medium
      # Run from a folder holding the material (for example plan.md). --mode plan keeps it read-only.
      command: 'agy --model gemini-4-argon-medium --mode plan -p "<review prompt>" > <outfile> 2>&1'
      note: List models with `agy models`.
    claude-haiku:
      optional: true
      model: claude-haiku-5-5
      effort: medium
      # Claude CLI, not agy. Read-only: plan permission mode and read-only tools only.
      command: 'claude --model claude-haiku-5-5 --effort medium --permission-mode plan --tools "Read,Glob,Grep" -p "<review prompt>" > <outfile> 2>&1'
      note: Optional extra or fallback when Codex is unavailable. Same author family as the lesson writer, so it is less independent; say so in the report.
    separate-agent:
      note: A separate session or agent, as the last fallback.

image_generation:
  # Lesson images use agy first. Codex is the fallback only when agy is unavailable.
  order: [agy-gemini, codex]
  providers:
    agy-gemini:
      # No --model flag: the prompt asks agy to call its generate_image tool explicitly.
      # Run from a new scratch folder for each image, never from the repo, so that
      # --dangerously-skip-permissions only reaches that folder.
      # Takes minutes per image. Run it in the background and wait for the file.
      command: 'agy --dangerously-skip-permissions --add-dir "$PWD" -p="Call generate_image to create <description>. <style, plain background, no text except these exact labels: "<labels>">. Copy the generated image to $PWD/<name>.jpg"'
      rules:
        - Name the tool (generate_image) and the exact output path in the prompt.
        - Put the exact label text in the prompt and ask for no other text; unspecified labels come out blank.
        - View every file; check each label and arrow; regenerate rather than patch (a reply can claim a save that never happened).
        - Do not wrap in `timeout` (macOS has none).
        - Convert to JPEG about 1200px wide before adding it to the lesson (for example `sips -s format jpeg -s formatOptions 85 -Z 1200`), then move it into the lesson's images folder.
    codex:
      note: Fallback only. Use the command in the user's global instructions, run from a scratch folder too.
